services:
  - type: web
    name: kpop-radar-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /
    envVars:
      - key: TG_TOKEN
        sync: false
      - key: SPOTIFY_ID
        sync: false
      - key: SPOTIFY_SECRET
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: CHANNEL_CHAT_ID
        sync: false
